name: Build M51 Kernel with KernelSU (A71 Base)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Cài đặt công cụ hệ thống
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses-dev bison flex libssl-dev libelf-dev clang lld llvm

    - name: Tải mã nguồn Kernel chuẩn từ ảnh của ní 🚀
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_kernel_samsung_a71 -b lineage-23.2 kernel-source

    - name: Tải bộ công cụ Proton Clang thần thánh 🛠️
      run: |
        # Tải bộ compiler vạn năng chuyên dụng cho Android Kernel
        git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

    - name: 🛠️ Bơm mã nguồn KernelSU Non-GKI
      run: |
        cd kernel-source
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        echo "CONFIG_KERNELSU=y" >> arch/arm64/configs/m51_defconfig

    - name: 🏗️ Tiến hành Biên dịch (Compile bằng Clang)
      run: |
        cd kernel-source
        export ARCH=arm64
        export SUBARCH=arm64
        # Gắn Proton Clang vào hệ thống để máy chủ nhận diện
        export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
        
        make O=out m51_defconfig
        
        # Ép hệ thống dùng Clang và các trình liên kết chuẩn Linux của Proton
        make -j$(nproc --all) O=out \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip

    - name: 📦 Đóng gói AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 AnyKernel
        cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel/
        cd AnyKernel
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r ../M51-A71-KernelSU.zip *

    - name: 🌟 Xuất File Thành Phẩm
      uses: actions/upload-artifact@v4
      with:
        name: M51-KernelSU-Zip
        path: M51-A71-KernelSU.zip
        
