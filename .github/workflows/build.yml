name: Build M51 Kernel with KernelSU (A71 Base)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Cài đặt công cụ
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev bison flex libssl-dev libelf-dev clang lld-llvm

    - name: Tải mã nguồn Kernel chuẩn từ ảnh của ní 🚀
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_kernel_samsung_a71 -b lineage-23.2 kernel-source

    - name: Tải công cụ biên dịch (Clang/Toolchain)
      run: |
        git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 -b gcc-master toolchain-64
        git clone --depth=1 https://github.com/mvaisakh/gcc-arm -b gcc-master toolchain-32

    - name: 🛠️ Bơm mã nguồn KernelSU Non-GKI
      run: |
        cd kernel-source
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # Đã sửa sẵn: Kích hoạt KernelSU thẳng vào m51_defconfig
        echo "CONFIG_KERNELSU=y" >> arch/arm64/configs/m51_defconfig

    - name: 🏗️ Tiến hành Biên dịch (Compile)
      run: |
        cd kernel-source
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain-64/bin/aarch64-elf-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchain-32/bin/arm-eabi-
        
        # Đã sửa sẵn: Gọi chính xác m51_defconfig để nấu
        make O=out m51_defconfig
        make -j$(nproc --all) O=out

    - name: 📦 Đóng gói AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 AnyKernel
        cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel/
        cd AnyKernel
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r ../M51-A71-KernelSU.zip *

    - name: 🌟 Xuất File Thành Phẩm
      uses: actions/upload-artifact@v4
      with:
        name: M51-KernelSU-Zip
        path: M51-A71-KernelSU.zip
        
